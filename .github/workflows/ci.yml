name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"
  # Must equal the exact wasm-bindgen pin in bindings/wasm/Cargo.toml.
  WASM_BINDGEN_VERSION: "0.2.129"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Independent verifier venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install lxml==6.0.2 cryptography==46.0.3
          echo "SUNAT_XMLDSIG_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain with wasm32
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Check the wasm-bindgen pin
        run: grep -q "wasm-bindgen = \"=$WASM_BINDGEN_VERSION\"" bindings/wasm/Cargo.toml
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: cargo build -p sunat-sdk-wasm --target wasm32-unknown-unknown --release --locked
      - run: wasm-bindgen --target nodejs --out-dir bindings/wasm/pkg target/wasm32-unknown-unknown/release/sunat_sdk_wasm.wasm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.11.0"
      - run: node bindings/wasm/test/sign-fixture.mjs

  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo build -p sunat-sdk-cli --release --locked
      - name: Expose the CLI binary
        run: echo "SUNAT_SDK_BIN=$GITHUB_WORKSPACE/target/release/sunat-sdk" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # 2.32.0
        with:
          php-version: "8.1"
          tools: composer:2.8.4
      - run: composer validate --strict
      # Includes VersionTest: SunatSdk::VERSION must equal the Cargo workspace version.
      - name: PHPUnit
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit
      - name: The Packagist dist carries only the PHP client and installs
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=pkg/ HEAD | tar -x -C "$RUNNER_TEMP"
          ( cd "$RUNNER_TEMP/pkg" && find . -type f | sort ) | tee "$RUNNER_TEMP/dist.txt"
          allowed='^\./(composer\.json|LICENSE|NOTICE|README\.md|bindings/php/(README\.md|bin/sunat-sdk-install|src/.+\.php))$'
          if grep -vE "$allowed" "$RUNNER_TEMP/dist.txt"; then
            echo "files outside the PHP client in the dist"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          echo '{"repositories":[{"type":"path","url":"../pkg","options":{"symlink":false}}],"require":{"kembec/facturacion-electronica-sunat-sdk":"*@dev"}}' > composer.json
          composer install --no-interaction --no-progress
          php -r 'require "vendor/autoload.php"; echo Kembec\SunatSdk\SunatSdk::VERSION, PHP_EOL;'
          vendor/bin/sunat-sdk-install --help
