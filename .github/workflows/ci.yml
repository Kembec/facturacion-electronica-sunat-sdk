name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"
  # Must equal the exact wasm-bindgen pin in bindings/wasm/Cargo.toml.
  WASM_BINDGEN_VERSION: "0.2.129"
  # Must equal maturin in bindings/python/pyproject.toml [build-system] and MATURIN_VERSION in release.yml.
  MATURIN_VERSION: "1.15.0"
  TWINE_VERSION: "7.0.0"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Independent verifier venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install lxml==6.0.2 cryptography==46.0.3
          echo "SUNAT_XMLDSIG_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain with wasm32
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Check the wasm-bindgen pin
        run: grep -q "wasm-bindgen = \"=$WASM_BINDGEN_VERSION\"" bindings/wasm/Cargo.toml
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.11.0"
      - name: npm version equals the Cargo workspace version
        run: node bindings/wasm/scripts/check-version.mjs
      - run: bindings/wasm/scripts/build.sh
      - name: npm pack
        working-directory: bindings/wasm/npm
        run: |
          npm pack --dry-run
          npm pack --pack-destination "$RUNNER_TEMP"
      # The packed tarball, installed in a clean project: types, then the 18 vectors in
      # Node and in headless Chrome. Node 22 first, then the oldest supported line.
      - run: bindings/wasm/scripts/test-package.sh "$RUNNER_TEMP"/kembec-facturacion-electronica-sunat-sdk-*.tgz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18.20.8"
      - run: bindings/wasm/scripts/test-package.sh "$RUNNER_TEMP"/kembec-facturacion-electronica-sunat-sdk-*.tgz

  # The sdist, as pip installs it on a platform without a wheel: it compiles, passes the vectors from
  # outside the tree and passes twine. release.yml builds and tests the wheel of each platform.
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check the maturin pin
        run: |
          grep -q "requires = \[\"maturin==$MATURIN_VERSION\"\]" bindings/python/pyproject.toml
          grep -q "MATURIN_VERSION: \"v$MATURIN_VERSION\"" .github/workflows/release.yml
      - name: Build the sdist
        run: |
          cp LICENSE NOTICE bindings/python/
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/pip" install --quiet "maturin==$MATURIN_VERSION" "twine==$TWINE_VERSION"
          "$RUNNER_TEMP/build/bin/maturin" sdist --out "$RUNNER_TEMP/dist" -m bindings/python/Cargo.toml
      - name: Version equals the Cargo workspace version
        run: python bindings/python/scripts/check_version.py --dist "$RUNNER_TEMP/dist"
      - run: "$RUNNER_TEMP/build/bin/twine" check --strict "$RUNNER_TEMP"/dist/*
      - name: The sdist compiles and passes the vectors
        run: bindings/python/scripts/test_wheel.sh "$RUNNER_TEMP"/dist/*.tar.gz python

  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo build -p sunat-sdk-cli --release --locked
      - name: Expose the CLI binary
        run: echo "SUNAT_SDK_BIN=$GITHUB_WORKSPACE/target/release/sunat-sdk" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # 2.32.0
        with:
          php-version: "8.1"
          tools: composer:2.8.4
      - run: composer validate --strict
      # Includes VersionTest: SunatSdk::VERSION must equal the Cargo workspace version.
      - name: PHPUnit
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit
      - name: The Packagist dist carries only the PHP client and installs
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=pkg/ HEAD | tar -x -C "$RUNNER_TEMP"
          ( cd "$RUNNER_TEMP/pkg" && find . -type f | sort ) | tee "$RUNNER_TEMP/dist.txt"
          allowed='^\./(composer\.json|LICENSE|NOTICE|README\.md|bindings/php/(README\.md|bin/sunat-sdk-install|src/.+\.php))$'
          if grep -vE "$allowed" "$RUNNER_TEMP/dist.txt"; then
            echo "files outside the PHP client in the dist"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          echo '{"repositories":[{"type":"path","url":"../pkg","options":{"symlink":false}}],"require":{"kembec/facturacion-electronica-sunat-sdk":"*@dev"}}' > composer.json
          composer install --no-interaction --no-progress
          php -r 'require "vendor/autoload.php"; echo Kembec\SunatSdk\SunatSdk::VERSION, PHP_EOL;'
          vendor/bin/sunat-sdk-install --help
