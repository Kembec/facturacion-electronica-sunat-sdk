name: crates

# The five library crates as crates.io gets them: cargo publish --dry-run of each one in dependency order, their
# docs.rs build, the vector battery compiled from the .crate files, and the declared rust-version. Nothing is
# published here; release.yml holds the publish step.
on:
  push:
    branches: ["**"]
    paths:
      - "crates/**"
      - "fixtures/**"
      - "tests/vectors/**"
      - "tests/xsd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/crates.yml"
  pull_request:
    paths:
      - "crates/**"
      - "fixtures/**"
      - "tests/vectors/**"
      - "tests/xsd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/crates.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"
  # In dependency order. check-publish.sh fails if crates.io would take any other workspace member.
  CRATES: "sunat-model sunat-transport sunat-sdk sunat-xmldsig sunat-ubl"

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # With SUNAT_XMLDSIG_PYTHON set, the schema and independent-verifier tests fail instead of skipping.
      - name: Independent verifier venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install lxml==6.0.2 cryptography==46.0.3
          echo "SUNAT_XMLDSIG_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - name: The published set, its metadata and its exact internal versions
        run: crates/scripts/check-publish.sh $CRATES
      - name: cargo publish --dry-run, each crate in dependency order
        run: cargo publish --dry-run --locked $(printf -- '-p %s ' $CRATES)
      - name: docs.rs build, warnings denied
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --locked $(printf -- '-p %s ' $CRATES)
      - name: Package
        run: cargo package --no-verify --locked $(printf -- '-p %s ' $CRATES)
      - name: The battery from the .crate files
        run: crates/scripts/test-package.sh target/package $CRATES

  rust-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain at the declared rust-version
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - name: The crates and their tests build with it
        run: cargo check --locked --all-targets $(printf -- '-p %s ' $CRATES)
