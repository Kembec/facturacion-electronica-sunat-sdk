name: release

# A pull request that touches the CLI or a binding proves the static binary, the npm tarball and the
# Python wheels and the NuGet package; only a `v*` tag publishes them, after the owner approves the `release` environment.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "CHANGELOG.md"
      - "bindings/cli/**"
      - "bindings/wasm/**"
      - "bindings/python/**"
      - "bindings/dotnet/**"
      - "bindings/ffi/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"
  TARGET: x86_64-unknown-linux-musl
  # Must equal maturin in bindings/python/pyproject.toml [build-system].
  MATURIN_VERSION: "v1.15.0"
  TWINE_VERSION: "7.0.0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SDK: "10.0.x"
  # In dependency order; the same list as crates.yml, where check-publish.sh holds it to the workspace.
  CRATES: "kembec-sunat-model kembec-sunat-transport kembec-sunat-sdk kembec-sunat-xmldsig kembec-sunat-ubl"

jobs:
  # A tag publishes only if CHANGELOG.md has its section (`## [0.1.0-beta.4] - 2026-10-16`); a pull request checks the
  # workspace version the same way, so a version bump arrives with its section (docs/releasing.md#versions).
  changelog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: CHANGELOG.md has the section of this version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)" ;;
          esac
          test -n "$version"
          pattern="^## \[$(printf '%s' "$version" | sed 's/[.]/\\./g')\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$"
          if ! grep -Eq "$pattern" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [$version] - YYYY-MM-DD' section for $version"
            exit 1
          fi
          echo "CHANGELOG.md has the section of $version"

  cli-linux-musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain with musl
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - name: musl C toolchain for ring
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build -p sunat-sdk-cli --release --locked --target "$TARGET"
      - name: Stage the binary
        run: |
          mkdir dist
          cp "target/$TARGET/release/sunat-sdk" "dist/sunat-sdk-$TARGET"
      - name: The binary is static
        run: |
          if readelf -d "dist/sunat-sdk-$TARGET" | grep -q NEEDED; then
            readelf -d "dist/sunat-sdk-$TARGET"
            exit 1
          fi
      - name: It signs a fixture like its vector
        run: |
          set -o pipefail
          bin="dist/sunat-sdk-$TARGET"
          case=01-invoice-taxed-cash
          "$bin" build < "fixtures/$case.json" | jq '{xml: .xml}' \
            | "$bin" sign --cert tests/vectors/test-cert/test-cert.pem --key tests/vectors/test-cert/test-key.pem > signed.json
          expected() { grep -o "<ds:$1>[^<]*" "tests/vectors/$case.signed.xml" | cut -d'>' -f2; }
          test "$(jq -r .digest_value signed.json)" = "$(expected DigestValue)"
          test "$(jq -r .signature_value signed.json)" = "$(expected SignatureValue)"
      - name: SHA-256
        working-directory: dist
        run: sha256sum "sunat-sdk-$TARGET" > "sunat-sdk-$TARGET.sha256" && cat "sunat-sdk-$TARGET.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sunat-sdk-${{ env.TARGET }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [changelog, cli-linux-musl]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The environment allows only v* tags and waits for the owner's approval.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sunat-sdk-${{ env.TARGET }}
          path: dist
      - name: GitHub release with the binary and its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "sunat-sdk CLI $GITHUB_REF_NAME: static Linux x86_64 (musl) binary and its SHA-256."

  # SwiftPM's binary: uploads to the release `publish` created the xcframework zip that the tagged Package.swift names,
  # taken from the swift.yml run in bindings/swift/release-source.json and checked against that checksum; it never
  # rebuilds it (docs/releasing.md). No job needs this one, so a Swift failure stops no other registry.
  swift-xcframework:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The pinned xcframework zip, checked, to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bindings/swift/scripts/publish-release.sh "$GITHUB_REF_NAME"

  npm-package:
    runs-on: ubuntu-24.04
    env:
      # Must equal the exact wasm-bindgen pin in bindings/wasm/Cargo.toml.
      WASM_BINDGEN_VERSION: "0.2.129"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain with wasm32
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Check the wasm-bindgen pin
        run: grep -q "wasm-bindgen = \"=$WASM_BINDGEN_VERSION\"" bindings/wasm/Cargo.toml
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.11.0"
      - name: npm version equals the Cargo workspace version, and the tag
        run: |
          tag=""
          case "$GITHUB_REF" in refs/tags/*) tag="$GITHUB_REF_NAME" ;; esac
          node bindings/wasm/scripts/check-version.mjs $tag
      - run: bindings/wasm/scripts/build.sh
      - name: npm pack
        working-directory: bindings/wasm/npm
        run: |
          mkdir "$RUNNER_TEMP/npm"
          npm pack --dry-run
          npm pack --pack-destination "$RUNNER_TEMP/npm"
      - name: The tarball passes the vectors in Node 22 and headless Chrome
        run: bindings/wasm/scripts/test-package.sh "$RUNNER_TEMP"/npm/*.tgz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18.20.8"
      - name: The tarball passes the vectors in Node 18
        run: bindings/wasm/scripts/test-package.sh "$RUNNER_TEMP"/npm/*.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error

  # Publishes the exact tarball npm-package tested, with provenance tied to this workflow run.
  publish-npm:
    needs: [changelog, npm-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The environment allows only v* tags and waits for the owner's approval. npm trusts this workflow file and this
    # environment (Trusted Publishing, OIDC): there is no npm token anywhere.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: npm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.11.0"
          registry-url: "https://registry.npmjs.org"
      - name: Trusted Publishing needs npm 11.5.1 or later
        run: node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - name: npm publish
        run: |
          dist_tag=""
          case "$GITHUB_REF_NAME" in *-*) dist_tag="--tag beta" ;; esac
          npm publish ./npm/*.tgz --provenance --access public $dist_tag

  # One abi3 wheel per platform (CPython 3.10 and later), each built and then installed and tested on a
  # runner of that platform: the 20 vectors on the oldest and the newest supported Python.
  python-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { name: windows-x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: oldest
        with:
          python-version: "3.10"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: newest
        with:
          python-version: "3.14"
      - name: LICENSE and NOTICE into the package (gitignored there)
        shell: bash
        run: cp LICENSE NOTICE bindings/python/
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          # glibc 2.17: the oldest manylinux, so the wheel installs on any current Linux with glibc.
          manylinux: "2014"
          args: --release --locked --out dist -m bindings/python/Cargo.toml
      - name: Version equals the Cargo workspace version
        shell: bash
        run: python bindings/python/scripts/check_version.py --dist dist
      - name: The installed wheel passes the vectors on Python 3.10
        shell: bash
        run: bindings/python/scripts/test_wheel.sh dist/*.whl "${{ steps.oldest.outputs.python-path }}"
      - name: The installed wheel passes the vectors on Python 3.14
        shell: bash
        run: bindings/python/scripts/test_wheel.sh dist/*.whl "${{ steps.newest.outputs.python-path }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  python-sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: LICENSE and NOTICE into the package (gitignored there)
        shell: bash
        run: cp LICENSE NOTICE bindings/python/
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist -m bindings/python/Cargo.toml
      - name: Version equals the Cargo workspace version, and the tag
        run: |
          tag=""
          case "$GITHUB_REF" in refs/tags/*) tag="$GITHUB_REF_NAME" ;; esac
          python bindings/python/scripts/check_version.py --dist dist $tag
      - name: Rust toolchain for pip to compile the sdist
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: The sdist compiles and passes the vectors
        run: bindings/python/scripts/test_wheel.sh dist/*.tar.gz python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Checks the exact files publish-pypi uploads: every wheel and the sdist, together.
  python-package:
    needs: [python-wheels, python-sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Five wheels and one sdist, all of the workspace version
        run: |
          ls -l dist
          test "$(ls dist/*.whl | wc -l)" -eq 5
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
          python bindings/python/scripts/check_version.py --dist dist
      - name: twine check
        run: |
          python -m venv "$RUNNER_TEMP/twine"
          "$RUNNER_TEMP/twine/bin/pip" install --quiet twine==${{ env.TWINE_VERSION }}
          "$RUNNER_TEMP/twine/bin/twine" check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-package
          path: dist/
          if-no-files-found: error

  # Publishes the exact files python-package checked, with attestations tied to this workflow run.
  publish-pypi:
    needs: [changelog, python-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The environment allows only v* tags and waits for the owner's approval; PYPI_API_TOKEN lives there. Without the
    # password input the action switches to Trusted Publishing (OIDC), once pypi.org trusts this workflow.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  # The C ABI for the six runtimes of the .NET package: the same builds as the `native` job of dotnet.yml (keep the two
  # matrices equal), so the package published is the one dotnet.yml tests.
  dotnet-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux2014_x86_64@sha256:f6a6f153c9cf45470507ebbc27013e5db14ce21331b62fd2c540561f25e5f0a5
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            image: quay.io/pypa/manylinux2014_aarch64@sha256:c10b5d2ce68a4426011b5b9b8492f01037b9d0fd2187ed1956b346aa42faeb17
          - { rid: osx-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { rid: osx-x64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { rid: win-x64, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { rid: win-x86, os: windows-2025, target: i686-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    name: dotnet-native (${{ matrix.rid }})
    env:
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build in manylinux2014
        if: runner.os == 'Linux'
        run: |
          docker run --rm -e RUST_TOOLCHAIN -e CARGO_TERM_COLOR -v "$PWD":/io -w /io "${{ matrix.image }}" bash -euc '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
            . "$HOME/.cargo/env"
            cargo build -p sunat-sdk-ffi --release --locked --target "${{ matrix.target }}"'
      - name: Build
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"
          cargo build -p sunat-sdk-ffi --release --locked --target "${{ matrix.target }}"
      - name: Stage runtimes/${{ matrix.rid }}/native
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          mkdir -p "stage/${{ matrix.rid }}/native"
          case "${{ matrix.rid }}" in
            win-*) cp "$out/sunat_sdk_ffi.dll" "stage/${{ matrix.rid }}/native/" ;;
            linux-*) cp "$out/libsunat_sdk_ffi.so" "stage/${{ matrix.rid }}/native/" ;;
            osx-*) cp "$out/libsunat_sdk_ffi.dylib" "stage/${{ matrix.rid }}/native/" ;;
          esac
          ls -l "stage/${{ matrix.rid }}/native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dotnet-native-${{ matrix.rid }}
          path: stage
          if-no-files-found: error

  # Kembec.SunatSdk packed with the six native builds and checked by the script dotnet.yml uses.
  dotnet-package:
    needs: dotnet-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dotnet-native-*
          path: bindings/dotnet/src/Kembec.SunatSdk/runtimes
          merge-multiple: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}
      - name: Package version equals the tag
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) exit 0 ;; esac
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' bindings/dotnet/src/Kembec.SunatSdk/Kembec.SunatSdk.csproj)"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Pack with the six native builds
        run: dotnet pack bindings/dotnet/src/Kembec.SunatSdk -c Release -o bindings/dotnet/artifacts --nologo
      - name: Version, contents and the oldest glibc
        run: bindings/dotnet/scripts/check-package.sh bindings/dotnet/artifacts/Kembec.SunatSdk.*[0-9].nupkg
      - name: Contents of the .nupkg
        run: unzip -Z1 bindings/dotnet/artifacts/Kembec.SunatSdk.*[0-9].nupkg | grep '^runtimes/'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-package
          path: |
            bindings/dotnet/artifacts/*.nupkg
            bindings/dotnet/artifacts/*.snupkg
          if-no-files-found: error

  # Publishes the exact .nupkg dotnet-package checked. A prerelease version (0.1.0-beta.N) goes up as it is.
  publish-nuget:
    needs: [changelog, dotnet-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The environment allows only v* tags and waits for the owner's approval; NUGET_API_KEY lives there.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nuget-package
          path: nuget
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}
      - name: dotnet nuget push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push nuget/Kembec.SunatSdk.*[0-9].nupkg --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: The version shows up on nuget.org
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://api.nuget.org/v3-flatcontainer/kembec.sunatsdk/index.json"
          # nuget.org validates and indexes a push before listing it: 1.0.0-rc.2 took more than 6 minutes.
          for attempt in $(seq 1 60); do
            if curl -fsS "$url" | jq -e --arg v "$version" '.versions | index($v | ascii_downcase)' >/dev/null; then
              echo "Kembec.SunatSdk $version is on nuget.org"
              exit 0
            fi
            echo "attempt $attempt: not listed yet"
            sleep 30
          done
          echo "::error::Kembec.SunatSdk $version is not on nuget.org after 30 minutes"
          exit 1

  # The crates as crates.io gets them, the same checks as crates.yml: a dry-run publish of each one in dependency order
  # (on a tag it also reports a version already on crates.io) and the vector battery compiled from the .crate files.
  crates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Independent verifier venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install lxml==6.0.2 cryptography==46.0.3
          echo "SUNAT_XMLDSIG_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - name: The published set, its metadata and its exact internal versions
        run: crates/scripts/check-publish.sh $CRATES
      - name: Version equals the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "kembec-sunat-model") | .version')"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: cargo publish --dry-run, each crate in dependency order
        run: cargo publish --dry-run --locked $(printf -- '-p %s ' $CRATES)
      - name: Package
        run: cargo package --no-verify --locked $(printf -- '-p %s ' $CRATES)
      - name: The battery from the .crate files
        run: crates/scripts/test-package.sh target/package $CRATES

  # Publishes the five crates to crates.io in dependency order, from the tagged tree the crates job tested, with the
  # owner's CARGO_REGISTRY_TOKEN (publish-new and publish-update, `kembec-sunat-*`) from the `release` environment.
  # After the first upload, Trusted Publishing can replace the token (docs/releasing.md).
  publish-crates:
    needs: [changelog, crates]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The environment allows only v* tags and waits for the owner's approval.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked $(printf -- '-p %s ' $CRATES)
