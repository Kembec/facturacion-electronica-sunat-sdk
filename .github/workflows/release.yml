name: release

# A pull request that touches the CLI build proves the static binary; only a `v*` tag publishes it.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "bindings/cli/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"
  TARGET: x86_64-unknown-linux-musl

jobs:
  cli-linux-musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Rust toolchain with musl
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - name: musl C toolchain for ring
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build -p sunat-sdk-cli --release --locked --target "$TARGET"
      - name: Stage the binary
        run: |
          mkdir dist
          cp "target/$TARGET/release/sunat-sdk" "dist/sunat-sdk-$TARGET"
      - name: The binary is static
        run: |
          if readelf -d "dist/sunat-sdk-$TARGET" | grep -q NEEDED; then
            readelf -d "dist/sunat-sdk-$TARGET"
            exit 1
          fi
      - name: It signs a fixture like its vector
        run: |
          set -o pipefail
          bin="dist/sunat-sdk-$TARGET"
          case=01-invoice-taxed-cash
          "$bin" build < "fixtures/$case.json" | jq '{xml: .xml}' \
            | "$bin" sign --cert tests/vectors/test-cert/test-cert.pem --key tests/vectors/test-cert/test-key.pem > signed.json
          expected() { grep -o "<ds:$1>[^<]*" "tests/vectors/$case.signed.xml" | cut -d'>' -f2; }
          test "$(jq -r .digest_value signed.json)" = "$(expected DigestValue)"
          test "$(jq -r .signature_value signed.json)" = "$(expected SignatureValue)"
      - name: SHA-256
        working-directory: dist
        run: sha256sum "sunat-sdk-$TARGET" > "sunat-sdk-$TARGET.sha256" && cat "sunat-sdk-$TARGET.sha256"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sunat-sdk-${{ env.TARGET }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: cli-linux-musl
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: sunat-sdk-${{ env.TARGET }}
          path: dist
      - name: GitHub release with the binary and its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "sunat-sdk CLI $GITHUB_REF_NAME: static Linux x86_64 (musl) binary and its SHA-256."
