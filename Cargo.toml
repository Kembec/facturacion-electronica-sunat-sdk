[workspace]
resolver = "2"
members = [
  "crates/sunat-model",
  "crates/sunat-ubl",
  "crates/sunat-xmldsig",
  "crates/sunat-transport",
  "crates/sunat-sdk",
  "bindings/cli",
  "bindings/ffi",
  "bindings/wasm",
  "bindings/python",
]

[workspace.package]
version = "0.1.0-beta.5"
edition = "2021"
# The oldest toolchain that builds the published crates with the locked dependencies (zopfli, under
# zip's deflate, asks for 1.88); the crates workflow checks it.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Kembec/facturacion-electronica-sunat-sdk"
homepage = "https://fe.kembec.com"
keywords = ["sunat", "peru", "facturacion", "e-invoicing", "xmldsig"]

# The five crates published to crates.io require each other at exactly the workspace version: they are
# released together, and a mixed set (a sunat-ubl built against another sunat-model) would not be the
# one that passed the vectors. The crates workflow fails if these drift from `version` above.
[workspace.dependencies]
sunat-model = { package = "kembec-sunat-model", path = "crates/sunat-model", version = "=0.1.0-beta.5" }
sunat-ubl = { package = "kembec-sunat-ubl", path = "crates/sunat-ubl", version = "=0.1.0-beta.5" }
sunat-xmldsig = { package = "kembec-sunat-xmldsig", path = "crates/sunat-xmldsig", version = "=0.1.0-beta.5" }
sunat-transport = { package = "kembec-sunat-transport", path = "crates/sunat-transport", version = "=0.1.0-beta.5" }
sunat-sdk = { package = "kembec-sunat-sdk", path = "crates/sunat-sdk", version = "=0.1.0-beta.5" }
