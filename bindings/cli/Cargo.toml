[package]
name = "sunat-sdk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

# The dispatch lives in the library so the C ABI (`bindings/ffi`) runs the same commands.
[lib]
name = "sunat_sdk_cli"
path = "src/lib.rs"

[[bin]]
name = "sunat-sdk"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sunat-model = { path = "../../crates/sunat-model" }
sunat-sdk = { path = "../../crates/sunat-sdk" }
sunat-ubl = { path = "../../crates/sunat-ubl" }
sunat-xmldsig = { path = "../../crates/sunat-xmldsig" }
# Default features: TLS through rustls with webpki roots; certificate verification stays on.
ureq = "2"

[dev-dependencies]
base64 = "0.22"
