[package]
name = "sunat-sdk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
# Distributed as the release binary, npm, PyPI and Packagist, not on crates.io.
publish = false

# The dispatch lives in the library so the C ABI (`bindings/ffi`) runs the same commands.
[lib]
name = "sunat_sdk_cli"
path = "src/lib.rs"

[[bin]]
name = "sunat-sdk"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sunat-model = { package = "kembec-sunat-model", path = "../../crates/sunat-model" }
sunat-sdk = { package = "kembec-sunat-sdk", path = "../../crates/sunat-sdk" }
sunat-ubl = { package = "kembec-sunat-ubl", path = "../../crates/sunat-ubl" }
sunat-xmldsig = { package = "kembec-sunat-xmldsig", path = "../../crates/sunat-xmldsig" }
# Default features: TLS through rustls with webpki roots; certificate verification stays on.
ureq = "3"

[dev-dependencies]
base64 = "0.22"
