[package]
name = "sunat-sdk-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
description = "C ABI of the SUNAT SDK: the CLI's commands in process, one JSON request in, one JSON response out"
publish = false

# cdylib for the languages that load a shared library (VB6, Visual FoxPro, PowerBuilder, C#, Java,
# Perl, Ruby, Swift...), staticlib for the ones that link it in (C, Objective-C, Swift packages),
# rlib so the tests call the same functions from Rust.
[lib]
name = "sunat_sdk_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# raw_value: the request's `input` reaches the command as the exact text the caller wrote, like the
# CLI's stdin, instead of a re-serialized copy.
serde_json = { version = "1", features = ["raw_value"] }
sunat-sdk-cli = { path = "../cli" }

[dev-dependencies]
sunat-xmldsig = { package = "kembec-sunat-xmldsig", path = "../../crates/sunat-xmldsig" }
