# Generates include/sunat_sdk.h through scripts/header.sh, which CI runs with --check.
language = "C"
include_guard = "SUNAT_SDK_H"
cpp_compat = true
usize_is_size_t = true
documentation_style = "c99"
autogen_warning = "/* Generated by bindings/ffi/scripts/header.sh (cbindgen) from bindings/ffi/src/lib.rs. Do not edit. */"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
# The library exports `extern "system"`: __stdcall on 32-bit Windows (VB6, Visual FoxPro and
# PowerBuilder declare that by default), the C convention everywhere else.
after_includes = """

#if defined(_WIN32) && (defined(_M_IX86) || defined(__i386__))
#define SUNAT_SDK_CALL __stdcall
#else
#define SUNAT_SDK_CALL
#endif"""

[fn]
prefix = "SUNAT_SDK_CALL"
args = "horizontal"
