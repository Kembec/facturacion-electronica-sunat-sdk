[package]
name = "sunat-sdk-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
# Distributed as the release binary, npm, PyPI and Packagist, not on crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
sunat-model = { path = "../../crates/sunat-model" }
sunat-sdk = { path = "../../crates/sunat-sdk" }
sunat-ubl = { path = "../../crates/sunat-ubl" }
sunat-xmldsig = { path = "../../crates/sunat-xmldsig" }
# Exact pin: wasm-bindgen-cli must match it (see .github/workflows/ci.yml).
wasm-bindgen = "=0.2.129"

[dev-dependencies]
base64 = "0.22"
