[package]
name = "sunat-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
description = "Input model of the SUNAT (Peru) e-invoicing SDK: invoices, receipts, credit and debit notes, daily summaries, void communications and despatch advices read from JSON and checked against SUNAT rules"
categories = ["finance", "encoding", "parser-implementations"]
readme = "README.md"
# The library, its tests' code and the notices. The data the tests read (fixtures/, tests/vectors/,
# tests/xsd/ and this crate's tests/data/) stays in the repository: the crates workflow runs this
# package's tests against it.
include = ["/src/**/*.rs", "/tests/**/*.rs", "/tests/*.py", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pure Rust with no target-specific code: one target is the whole documentation.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
